name: Build and Release

on:
  push:
    branches:
      - main
    paths:
      - "plugin.json"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Read plugin version
        id: version
        run: |
          VERSION=$(node -p "require('./plugin.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build project
        run: npm run build

      - name: Find generated ZIP
        id: zip
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CURRENT_DIR=$(pwd)
          # ls
          # cd ..
          # ls
          
          # echo "$CURRENT_DIR"
          ZIP="liveserver-v${VERSION}.zip"

          if [ ! -f "$ZIP" ]; then
            echo "Error: $ZIP was not generated in the project root."
            exit 1
          fi

          echo "file=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="${{ steps.zip.outputs.file }}"

          gh release create "$TAG" "$ZIP" \
            --title "LiveServer $VERSION" \
            --generate-notes \
            --latest


      - name: Acode Marketplace Publish
        run: node upload.cjs
        env:
          ACODE_COOKIE: ${{ secrets.ACODE_COOKIE }}

          
